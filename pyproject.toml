[project]
name = "fohor"
version = "0.1.0"
description = "Kathmandu Valley waste-flow lakehouse on AWS: Overture Maps + HRSL on AWS Open Data -> S3 -> Athena, with a quality gate and a landfill-blockade report"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Bikash Kushwaha"}]
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.2",
    "networkx>=3.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3,sns]>=5", "ruff>=0.6", "cfn-lint>=1.0", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["fohor*"]

[tool.setuptools.package-data]
"fohor.sql" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["lake"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
